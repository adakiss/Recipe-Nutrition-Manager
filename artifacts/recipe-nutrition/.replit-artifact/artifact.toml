kind = "web"
previewPath = "/"
title = "Recipe Nutrition Manager"
description = "A multi-user recipe and ingredient manager with calorie-aware recipes, ratings, cooking notes, and an admin approval workflow."
version = "1.0.0"
id = "artifacts/recipe-nutrition"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22420

[services.development]
run = "pnpm --filter @workspace/recipe-nutrition run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/recipe-nutrition", "run", "build" ]
serve = "static"
publicDir = "artifacts/recipe-nutrition/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22420"
BASE_PATH = "/"
