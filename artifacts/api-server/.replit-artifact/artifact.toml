kind = "api"
previewPath = "/api"
title = "Recipe Nutrition API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "mvn -q spring-boot:run -Dspring-boot.run.profiles=local-h2"

[services.production]

[services.production.build]
args = ["mvn", "-q", "-DskipTests", "package"]

[services.production.run]
args = ["java", "-jar", "target/recipe-nutrition-api-0.1.0.jar"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
